# Serving payment-widget.min.js from our own nginx instead of a public CDN.
#
# Server layout (as deployed):
#
#   /usr/share/nginx/html/          ← web root
#   ├── plugin/                     ← the payment gateway (Flutter web build)
#   ├── sdk/                        ← THIS: payment-widget.min.js
#   └── index.html, assets/, *.js   ← the Angular portal
#
# Because sdk/ already sits inside the web root, nginx serves it without any
# location block at all. The block below exists for ONE reason: the CORS
# header. Merchant checkout pages load this script from their own domains,
# and without it the browser blocks the request.
#
# Install:
#   sudo cp payment-widget.nginx.conf /etc/nginx/snippets/
# then inside the server { } block that serves this site:
#   include /etc/nginx/snippets/payment-widget.nginx.conf;
#
# HTTPS is required — merchant pages are https and a browser refuses to load
# a script over http into a secure page.

location /sdk/ {
    # A public library served to any merchant is exactly what `*` is for;
    # nothing user-specific is exposed here.
    #
    # `always` matters: without it nginx drops the header on 304 responses,
    # and a revalidated cache hit then fails CORS in the browser.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Deliberately short. This is a single unversioned path, so this TTL is
    # the upper bound on how long a bad build stays live. 5 minutes plus ETag
    # revalidation means a fix reaches merchants quickly, while unchanged
    # fetches still return a cheap 304.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    charset utf-8;

    # ~53 KB obfuscated, compresses to roughly a quarter of that.
    gzip            on;
    gzip_types      application/javascript;
    gzip_min_length 1024;
}

# Pinned copies written by publish.sh, kept for rollback. Safe to cache hard
# because a given version's bytes never change.
location ~ ^/sdk/v[0-9.]+/ {
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    charset utf-8;
    gzip       on;
    gzip_types application/javascript;
}
